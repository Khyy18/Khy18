name: tests

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile все .py)
        run: |
          python -m compileall -q . -x '_incoming/|build/|dist/'

      - name: Smoke import (бот должен импортироваться)
        env:
          TELEGRAM_TOKEN: x
          TELEGRAM_CHAT_ID: "1"
        run: python -c "import main; print('OK')"

      - name: Pytest
        env:
          TELEGRAM_TOKEN: x
          TELEGRAM_CHAT_ID: "1"
        run: pytest tests/ -v --tb=short
