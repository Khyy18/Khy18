name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, "feat/*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check ai_office/
      - name: Ruff format check
        run: ruff format --check ai_office/

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r ai_office/requirements.txt
      - name: Run tests
        run: python -m pytest ai_office/tests/ -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_office/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ai_office/frontend
      - name: Build
        run: npm run build
        working-directory: ai_office/frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f ai_office/deploy/Dockerfile -t ai-office:ci .
