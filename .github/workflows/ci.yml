# CI/CD Pipeline for Zenith Control
# Secrets must be configured in GitHub repo Settings > Secrets and variables > Actions:
#   - SSH_HOST: VPS hostname or IP
#   - SSH_USER: SSH username for deployment
#   - SSH_KEY: Private SSH key for authentication
#   - SSH_PORT: SSH port (e.g. 22)

name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check . --select=E,F,I --ignore=F401,E501

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -c "import config; import memory; import freelance_automation; import viral; import ad_testing; import payments; import legal; import task_queue; import health; import rate_limiter; import monitoring; import db"

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e/ -v --tb=short
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, import-check]
    if: github.ref == 'refs/heads/feat/zenith-control-ultimate' && github.event_name == 'push'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/zenith-control
            git pull origin feat/zenith-control-ultimate
            pip install -r requirements.txt
            cd deploy
            bash deploy.sh

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            for i in $(seq 1 10); do
              if curl -sf http://localhost/health > /dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i/10 - waiting..."
              sleep 2
            done
            echo "Health check failed after 10 attempts"
            exit 1
