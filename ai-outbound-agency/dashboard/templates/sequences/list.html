{% extends "base.html" %}

{% block title %}Sequences - AI Outbound Agency{% endblock %}
{% block page_title %}Sequences{% endblock %}

{% block content %}
<div class="mb-6 flex justify-between items-center">
    <h3 class="text-lg font-semibold text-gray-800">All Sequences</h3>
    <button onclick="document.getElementById('create-modal').classList.remove('hidden')"
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition text-sm font-medium">
        Create Sequence
    </button>
</div>

<!-- Sequences Table -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Steps Count</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Campaigns Using</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody id="sequences-table" class="bg-white divide-y divide-gray-200">
            <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading sequences...</td></tr>
        </tbody>
    </table>
</div>

<!-- Create Sequence Modal -->
<div id="create-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
        <h3 class="text-lg font-semibold mb-4">Create Sequence</h3>
        <form id="create-sequence-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Sequence Name</label>
                <input type="text" id="sequence-name" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="document.getElementById('create-modal').classList.add('hidden')"
                    class="px-4 py-2 text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Create</button>
            </div>
        </form>
    </div>
</div>

<script>
async function loadSequences() {
    const response = await authFetch('/api/sequences?limit=50');
    if (response.ok) {
        const data = await response.json();
        const tbody = document.getElementById('sequences-table');
        if (data.sequences && data.sequences.length > 0) {
            tbody.innerHTML = data.sequences.map(seq => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">
                        <a href="/sequences/${seq.id}" class="text-blue-600 hover:underline">${seq.name}</a>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">${seq.steps ? seq.steps.length : 0}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${seq.campaign_count || 0}</td>
                    <td class="px-6 py-4 text-sm">
                        <a href="/sequences/${seq.id}" class="text-blue-600 hover:underline">Edit</a>
                    </td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No sequences found</td></tr>';
        }
    }
}

document.getElementById('create-sequence-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('sequence-name').value;
    const response = await authFetch('/api/sequences', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, steps: [] })
    });
    if (response.ok) {
        document.getElementById('create-modal').classList.add('hidden');
        loadSequences();
    }
});

document.addEventListener('DOMContentLoaded', loadSequences);
</script>
{% endblock %}
