{% extends "base.html" %}

{% block title %}Sequence Builder - AI Outbound Agency{% endblock %}
{% block page_title %}Sequence Builder{% endblock %}

{% block content %}
<!-- Sequence Name -->
<div class="bg-white rounded-lg shadow p-6 mb-6">
    <div class="flex items-center justify-between">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">Sequence Name</label>
            <input type="text" id="sequence-name"
                class="w-full max-w-md px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button onclick="saveSequence()"
            class="ml-4 px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">
            Save
        </button>
    </div>
</div>

<!-- Steps List -->
<div class="bg-white rounded-lg shadow p-6">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-800">Steps</h3>
        <button onclick="addStep()"
            class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 text-sm font-medium">
            Add Step
        </button>
    </div>

    <div id="steps-container" class="space-y-4">
        <p class="text-gray-500 text-sm">Loading sequence...</p>
    </div>
</div>

<script>
let steps = [];

async function loadSequence() {
    const response = await authFetch('/api/sequences/{{ sequence_id }}');
    if (response.ok) {
        const data = await response.json();
        document.getElementById('sequence-name').value = data.name;
        steps = data.steps || [];
        renderSteps();
    }
}

function renderSteps() {
    const container = document.getElementById('steps-container');
    if (steps.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm">No steps added yet. Click "Add Step" to begin.</p>';
        return;
    }
    container.innerHTML = steps.map((step, index) => `
        <div class="border border-gray-200 rounded-lg p-4">
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm font-semibold text-gray-700">Step ${index + 1}</span>
                <button onclick="removeStep(${index})" class="text-red-500 hover:text-red-700 text-sm">Remove</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Channel</label>
                    <select onchange="updateStep(${index}, 'channel', this.value)"
                        class="w-full px-2 py-1 border border-gray-300 rounded text-sm">
                        <option value="email" ${step.channel === 'email' ? 'selected' : ''}>Email</option>
                        <option value="linkedin_view" ${step.channel === 'linkedin_view' ? 'selected' : ''}>LinkedIn Profile View</option>
                        <option value="linkedin_connect" ${step.channel === 'linkedin_connect' ? 'selected' : ''}>LinkedIn Connection Request</option>
                        <option value="linkedin_message" ${step.channel === 'linkedin_message' ? 'selected' : ''}>LinkedIn Message</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Delay (days)</label>
                    <input type="number" value="${step.delay_days || 0}" min="0"
                        onchange="updateStep(${index}, 'delay_days', parseInt(this.value))"
                        class="w-full px-2 py-1 border border-gray-300 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Template</label>
                    <input type="text" value="${step.template || ''}" placeholder="Template name"
                        onchange="updateStep(${index}, 'template', this.value)"
                        class="w-full px-2 py-1 border border-gray-300 rounded text-sm">
                </div>
            </div>
            <div class="mt-3">
                <label class="block text-xs font-medium text-gray-500 mb-1">Content Preview</label>
                <textarea onchange="updateStep(${index}, 'content', this.value)" rows="2"
                    class="w-full px-2 py-1 border border-gray-300 rounded text-sm">${step.content || ''}</textarea>
            </div>
        </div>
    `).join('');
}

function addStep() {
    steps.push({ channel: 'email', delay_days: 1, template: '', content: '' });
    renderSteps();
}

function removeStep(index) {
    steps.splice(index, 1);
    renderSteps();
}

function updateStep(index, field, value) {
    steps[index][field] = value;
}

async function saveSequence() {
    const name = document.getElementById('sequence-name').value;
    const response = await authFetch('/api/sequences/{{ sequence_id }}', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, steps })
    });
    if (response.ok) {
        alert('Sequence saved successfully!');
    }
}

document.addEventListener('DOMContentLoaded', loadSequence);
</script>
{% endblock %}
