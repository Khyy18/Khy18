{% extends "base.html" %}

{% block title %}Leads - AI Outbound Agency{% endblock %}
{% block page_title %}Leads{% endblock %}

{% block content %}
<!-- Filter Bar -->
<div class="bg-white rounded-lg shadow p-4 mb-6 flex items-center space-x-4">
    <div>
        <label class="text-sm font-medium text-gray-700 mr-2">Status:</label>
        <select id="filter-status" onchange="loadLeads()"
            class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">All</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="replied">Replied</option>
            <option value="qualified">Qualified</option>
            <option value="booked">Booked</option>
            <option value="lost">Lost</option>
        </select>
    </div>
    <div>
        <label class="text-sm font-medium text-gray-700 mr-2">Campaign:</label>
        <select id="filter-campaign" onchange="loadLeads()"
            class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">All Campaigns</option>
        </select>
    </div>
    <div class="flex-1"></div>
    <button onclick="document.getElementById('import-modal').classList.remove('hidden')"
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition text-sm font-medium">
        Import Leads
    </button>
</div>

<!-- Leads Table -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Company</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Score</th>
            </tr>
        </thead>
        <tbody id="leads-table" class="bg-white divide-y divide-gray-200">
            <tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading leads...</td></tr>
        </tbody>
    </table>
</div>

<!-- Pagination -->
<div class="mt-4 flex justify-between items-center">
    <button id="btn-prev" onclick="changePage(-1)" disabled
        class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
        Previous
    </button>
    <span id="page-info" class="text-sm text-gray-600">Page 1</span>
    <button id="btn-next" onclick="changePage(1)"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
        Next
    </button>
</div>

<!-- Import Modal -->
<div id="import-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
        <h3 class="text-lg font-semibold mb-4">Import Leads from CSV</h3>
        <form id="import-form" enctype="multipart/form-data">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">CSV File</label>
                <input type="file" id="csv-file" accept=".csv" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="document.getElementById('import-modal').classList.add('hidden')"
                    class="px-4 py-2 text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Import</button>
            </div>
        </form>
    </div>
</div>

<script>
let currentPage = 0;
const pageSize = 20;

async function loadLeads() {
    const status = document.getElementById('filter-status').value;
    const campaign = document.getElementById('filter-campaign').value;
    let url = `/api/leads?limit=${pageSize}&offset=${currentPage * pageSize}`;
    if (status) url += `&status=${status}`;
    if (campaign) url += `&campaign_id=${campaign}`;

    const response = await authFetch(url);
    if (response.ok) {
        const data = await response.json();
        const tbody = document.getElementById('leads-table');
        if (data.leads && data.leads.length > 0) {
            tbody.innerHTML = data.leads.map(lead => `
                <tr class="hover:bg-gray-50 cursor-pointer" onclick="window.location.href='/leads/${lead.id}'">
                    <td class="px-6 py-4 text-sm text-gray-900">${lead.first_name || ''} ${lead.last_name || ''}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.email}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.company || '--'}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.title || '--'}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full ${getStatusColor(lead.status)}">${lead.status}</span></td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.score || 0}</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No leads found</td></tr>';
        }
        document.getElementById('page-info').textContent = `Page ${currentPage + 1}`;
        document.getElementById('btn-prev').disabled = currentPage === 0;
        document.getElementById('btn-next').disabled = !data.leads || data.leads.length < pageSize;
    }
}

function getStatusColor(status) {
    const colors = {
        new: 'bg-blue-100 text-blue-800',
        contacted: 'bg-indigo-100 text-indigo-800',
        replied: 'bg-green-100 text-green-800',
        qualified: 'bg-yellow-100 text-yellow-800',
        booked: 'bg-emerald-100 text-emerald-800',
        lost: 'bg-red-100 text-red-800'
    };
    return colors[status] || 'bg-gray-100 text-gray-800';
}

function changePage(delta) {
    currentPage += delta;
    if (currentPage < 0) currentPage = 0;
    loadLeads();
}

document.getElementById('import-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('csv-file');
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    const token = localStorage.getItem('access_token');
    const response = await fetch('/api/leads/import', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
    });

    if (response.ok) {
        document.getElementById('import-modal').classList.add('hidden');
        loadLeads();
    }
});

document.addEventListener('DOMContentLoaded', loadLeads);
</script>
{% endblock %}
