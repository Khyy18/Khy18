global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram

receivers:
  - name: telegram
    webhook_configs:
      # Send alerts directly to the Telegram Bot API.
      # Replace <YOUR_BOT_TOKEN> with the actual bot token and <CHAT_ID> with
      # the target chat/group ID before deploying.
      - url: "https://api.telegram.org/bot<YOUR_BOT_TOKEN>/sendMessage"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
