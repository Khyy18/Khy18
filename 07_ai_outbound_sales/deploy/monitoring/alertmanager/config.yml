global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram

receivers:
  - name: telegram
    webhook_configs:
      - url: "http://telegram-bot:8080/alert"
        send_resolved: true
        http_config:
          basic_auth:
            username: "alertmanager"
            password: "${ALERTMANAGER_WEBHOOK_PASSWORD}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
