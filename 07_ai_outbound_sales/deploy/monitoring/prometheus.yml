global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "outbound-sales-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000
        labels:
          service: outbound-sales

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090
