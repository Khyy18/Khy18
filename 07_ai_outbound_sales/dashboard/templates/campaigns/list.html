{% extends "base.html" %}

{% block title %}Campaigns - AI Outbound Agency{% endblock %}
{% block page_title %}Campaigns{% endblock %}

{% block content %}
<div class="mb-6 flex justify-between items-center">
    <h3 class="text-lg font-semibold text-gray-800">All Campaigns</h3>
    <button onclick="document.getElementById('create-modal').classList.remove('hidden')"
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition text-sm font-medium">
        Create Campaign
    </button>
</div>

<!-- Campaign Table -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Leads</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200" id="campaigns-table"
               hx-get="/api/campaigns?limit=50"
               hx-trigger="load"
               hx-swap="innerHTML"
               hx-headers='js:{"Authorization": "Bearer " + localStorage.getItem("access_token")}'>
            <tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Loading campaigns...</td></tr>
        </tbody>
    </table>
</div>

<!-- Create Campaign Modal -->
<div id="create-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
        <h3 class="text-lg font-semibold mb-4">Create Campaign</h3>
        <form id="create-campaign-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Campaign Name</label>
                <input type="text" id="campaign-name" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Sequence ID (optional)</label>
                <input type="text" id="campaign-sequence"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="document.getElementById('create-modal').classList.add('hidden')"
                    class="px-4 py-2 text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Create</button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('create-campaign-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('campaign-name').value;
    const sequence_id = document.getElementById('campaign-sequence').value || null;

    const body = { name };
    if (sequence_id) body.sequence_id = sequence_id;

    const response = await authFetch('/api/campaigns', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });

    if (response.ok) {
        document.getElementById('create-modal').classList.add('hidden');
        htmx.trigger('#campaigns-table', 'load');
    }
});

async function activateCampaign(id) {
    await authFetch(`/api/campaigns/${id}/activate`, { method: 'POST' });
    htmx.trigger('#campaigns-table', 'load');
}

async function pauseCampaign(id) {
    await authFetch(`/api/campaigns/${id}/pause`, { method: 'POST' });
    htmx.trigger('#campaigns-table', 'load');
}

async function deleteCampaign(id) {
    if (confirm('Are you sure you want to delete this campaign?')) {
        await authFetch(`/api/campaigns/${id}`, { method: 'DELETE' });
        htmx.trigger('#campaigns-table', 'load');
    }
}
</script>
{% endblock %}
