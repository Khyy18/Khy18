name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_ai_outbound_sales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('07_ai_outbound_sales/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_ai_outbound_sales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('07_ai_outbound_sales/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
      - run: pip install -r requirements.txt
      - run: pytest tests/ --tb=short

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_ai_outbound_sales/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: 07_ai_outbound_sales/frontend/node_modules/.cache
          key: ${{ runner.os }}-npm-${{ hashFiles('07_ai_outbound_sales/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_ai_outbound_sales
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-outbound-sales:test .
