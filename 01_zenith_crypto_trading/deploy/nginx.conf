# ==========================================================================
# TLS TERMINATION
# --------------------------------------------------------------------------
# Этот конфиг слушает только HTTP (port 80). TLS-терминация ожидается
# на уровне вышестоящего балансировщика нагрузки (например, Cloudflare,
# AWS ALB, или отдельный nginx-ingress).
#
# Если балансировщик отсутствует и сервер доступен напрямую из интернета,
# необходимо добавить TLS:
#   listen 443 ssl;
#   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#   ssl_protocols       TLSv1.2 TLSv1.3;
#
# Без TLS заголовки вебхуков (X-Telegram-Bot-Api-Secret-Token) и данные
# платежей передаются в открытом виде.
# ==========================================================================

upstream blue {
    server 127.0.0.1:8081;
}

upstream green {
    server 127.0.0.1:8082;
}

include /etc/nginx/active_upstream.conf;

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location /health {
        proxy_pass http://active/health;
    }

    location / {
        proxy_pass http://active;
    }
}
