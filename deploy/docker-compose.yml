services:
  zenith:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      # Перекрываем дефолт из Dockerfile, если хочется писать в bind-mount:
      TRADES_DB_PATH: /app/data/trades.db
    volumes:
      # Именованный volume для SQLite - переживает up --build / pull / rebuild.
      # Можно заменить на bind ./data:/app/data, если нужен прямой доступ
      # к файлу с хоста для бэкапов.
      - zenith_data:/app/data
    init: true
    restart: unless-stopped

volumes:
  zenith_data:
