# Nginx reverse proxy for Kindergarten Accountant API
#
# IMPORTANT: HTTPS is commented out because TLS certificates must be obtained
# via Let's Encrypt (certbot) in production. Steps:
#   1. Install certbot: apt install certbot python3-certbot-nginx
#   2. Obtain certificate: certbot --nginx -d your-domain.ru
#   3. Uncomment the HTTPS server block below
#   4. Uncomment the HTTP-to-HTTPS redirect
#   5. Reload nginx: systemctl reload nginx
#
# Until HTTPS is configured, traffic flows over plain HTTP without HSTS.

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/m;

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (uncomment when TLS is configured)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;

        # Security headers (HSTS intentionally omitted - only valid over HTTPS)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/v1/ai/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stricter rate limit for AI endpoints
        limit_req zone=ai burst=5 nodelay;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

