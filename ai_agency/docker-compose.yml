version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python main_multi.py
    env_file: .env
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - app-backups:/app/backups
    environment:
      - DATABASE_PATH=/app/data/agency.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin_bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python admin_bot.py
    env_file: .env
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/agency.db
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/agency.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/orders"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -c "import asyncio; from web.app import start_web_app; asyncio.run(start_web_app())"
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/agency.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -c "import asyncio; from scheduler_standalone import run_scheduler; asyncio.run(run_scheduler())"
    env_file: .env
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - app-backups:/app/backups
    environment:
      - DATABASE_PATH=/app/data/agency.db
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agency
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agency_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full
    restart: unless-stopped

volumes:
  app-data:
    driver: local
  app-logs:
    driver: local
  app-backups:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
