<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agency - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app" class="max-w-md mx-auto p-4">
        <!-- Navigation -->
        <nav class="flex justify-between mb-6 bg-white rounded-lg p-2 shadow-sm">
            <button onclick="showPage('catalog')" class="nav-btn active" id="nav-catalog">Каталог</button>
            <button onclick="showPage('order')" class="nav-btn" id="nav-order">Заказ</button>
            <button onclick="showPage('history')" class="nav-btn" id="nav-history">История</button>
            <button onclick="showPage('balance')" class="nav-btn" id="nav-balance">Баланс</button>
        </nav>

        <!-- Catalog Page -->
        <div id="page-catalog" class="page">
            <h2 class="text-xl font-bold mb-4">Наши услуги</h2>
            <div id="services-list" class="space-y-3">
                <div class="animate-pulse bg-gray-200 h-20 rounded-lg"></div>
                <div class="animate-pulse bg-gray-200 h-20 rounded-lg"></div>
            </div>
        </div>

        <!-- Order Page -->
        <div id="page-order" class="page hidden">
            <h2 class="text-xl font-bold mb-4">Новый заказ</h2>
            <form id="order-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Услуга</label>
                    <select id="order-service" class="w-full p-3 border rounded-lg">
                        <option value="">Загрузка...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Текст задания</label>
                    <textarea id="order-text" rows="4" class="w-full p-3 border rounded-lg" placeholder="Опишите задачу..."></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg font-medium hover:bg-blue-600 transition">
                    Создать заказ
                </button>
            </form>
            <div id="order-result" class="hidden mt-4 p-4 bg-green-50 rounded-lg"></div>
        </div>

        <!-- History Page -->
        <div id="page-history" class="page hidden">
            <h2 class="text-xl font-bold mb-4">История заказов</h2>
            <div id="orders-list" class="space-y-3">
                <p class="text-gray-500">Загрузка...</p>
            </div>
        </div>

        <!-- Balance Page -->
        <div id="page-balance" class="page hidden">
            <h2 class="text-xl font-bold mb-4">Баланс</h2>
            <div id="balance-info" class="bg-white rounded-lg p-6 shadow-sm">
                <p class="text-gray-500">Загрузка...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
