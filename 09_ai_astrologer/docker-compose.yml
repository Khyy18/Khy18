version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_astrologer
      POSTGRES_USER: astrologer
      POSTGRES_PASSWORD: astrologer_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrologer -d ai_astrologer"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://astrologer:astrologer_secret@postgres:5432/ai_astrologer
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - SIMLI_API_KEY=${SIMLI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-EXAVITQu4vr4xnSDxMaL}
      - MINUTE_COST_COINS=${MINUTE_COST_COINS:-10}
      - BILLING_INTERVAL_SECONDS=${BILLING_INTERVAL_SECONDS:-60}
      - GRACE_PERIOD_SECONDS=${GRACE_PERIOD_SECONDS:-30}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      - VAD_ENERGY_THRESHOLD=${VAD_ENERGY_THRESHOLD:-0.01}
      - VAD_SILENCE_DURATION_MS=${VAD_SILENCE_DURATION_MS:-800}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  redis_data:
  postgres_data:
