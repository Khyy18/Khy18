<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата - Zenith Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            margin-top: 40px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            text-align: center;
        }
        .order-summary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .order-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .order-row:last-child { margin-bottom: 0; }
        .amount {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 24px 0;
        }
        .stars-icon::before { content: "\2B50"; margin-right: 4px; }
        .pay-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .pay-btn:active { opacity: 0.8; }
        .status { text-align: center; margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оплата</h1>
        <div class="order-summary">
            <div class="order-row">
                <span>Услуга:</span>
                <span id="description">-</span>
            </div>
            <div class="order-row">
                <span>Статус:</span>
                <span id="status">Ожидание</span>
            </div>
        </div>
        <div class="amount">
            <span class="stars-icon"></span>
            <span id="amount">0</span> Stars
        </div>
        <button class="pay-btn" id="payBtn" onclick="handlePay()">Оплатить</button>
        <div class="status" id="statusMsg"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Чтение параметров из URL или initDataUnsafe
        const params = new URLSearchParams(window.location.search);
        const invoiceUrl = params.get('invoice_url') || '';
        const amount = params.get('amount') || '0';
        const description = params.get('description') || '';

        // Отображение данных заказа
        document.getElementById('amount').textContent = amount;
        document.getElementById('description').textContent = description || 'Zenith Control';

        function handlePay() {
            if (!invoiceUrl) {
                document.getElementById('statusMsg').textContent = 'Ошибка: ссылка на инвойс не найдена';
                return;
            }
            // Открываем инвойс через Telegram WebApp API
            tg.openInvoice(invoiceUrl, function(status) {
                if (status === 'paid') {
                    document.getElementById('status').textContent = 'Оплачено';
                    document.getElementById('statusMsg').textContent = 'Оплата прошла успешно!';
                    document.getElementById('payBtn').disabled = true;
                    document.getElementById('payBtn').textContent = 'Оплачено';
                    // Закрываем Mini App через 2 секунды
                    setTimeout(function() { tg.close(); }, 2000);
                } else if (status === 'cancelled') {
                    document.getElementById('statusMsg').textContent = 'Оплата отменена';
                } else if (status === 'failed') {
                    document.getElementById('statusMsg').textContent = 'Ошибка оплаты';
                }
            });
        }

        // Настройка MainButton (альтернатива кнопке на странице)
        if (tg.MainButton) {
            tg.MainButton.setText('Оплатить ' + amount + ' Stars');
            tg.MainButton.onClick(handlePay);
            tg.MainButton.show();
        }
    </script>
</body>
</html>
