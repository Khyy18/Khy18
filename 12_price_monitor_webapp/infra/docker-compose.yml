version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: price_monitor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: price_monitor
      POSTGRES_PASSWORD: price_monitor_secret
      POSTGRES_DB: price_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: price_monitor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: price_monitor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: price_monitor_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: price_monitor_admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: price_monitor_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - admin

volumes:
  postgres_data:
  redis_data:
