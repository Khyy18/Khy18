version: "3.8"

services:
  arbitrage-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ARB_DRY_RUN=true
      - ARB_DB_PATH=/app/data/arbitrage.db
    volumes:
      - ./data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import arbitrage"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
